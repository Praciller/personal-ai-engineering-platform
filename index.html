<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal AI Engineering Platform</title>
<style>
  :root { color-scheme: dark; font: 16px/1.6 system-ui, sans-serif; background: #101827; color: #e7eef9; }
  main { max-width: 48rem; margin: 10vh auto; padding: 0 1.25rem; }
  h1 { line-height: 1.12; font-size: clamp(2rem, 6vw, 3.7rem); letter-spacing: -.045em; }
  button { padding: .65rem 1rem; border: 0; border-radius: .5rem; font: inherit; font-weight: bold; background: #9acbff; color: #102039; cursor: pointer; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #19263b; border-radius: .5rem; }
</style>
<main>
  <h1>Personal AI Engineering Platform</h1>
  <p>Run two rules-based workers against a synthetic orders ingestion incident. Triage identifies failed checks, and review assigns severity and recommends a response.</p>
  <button type="button">Run demo</button>
  <p role="status">Ready to run</p>
  <pre hidden></pre>
</main>
<script src="/demo.js" defer></script>
</html>
