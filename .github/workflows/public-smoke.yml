name: Public demo smoke test
on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Public HTTPS origin for the deployment under test
        type: string
        default: https://personal-ai-engineering-platform-seven.vercel.app
      expected_commit:
        description: Full Git SHA expected in the demo API responses
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Require the deployment commit
        if: github.event_name == 'repository_dispatch'
        env:
          EXPECTED_COMMIT: ${{ github.event.client_payload.git.sha }}
        run: test -n "$EXPECTED_COMMIT"
      - name: Check public UI, health and worker output
        env:
          DEMO_URL: ${{ inputs.deployment_url || 'https://personal-ai-engineering-platform-seven.vercel.app' }}
          EXPECTED_COMMIT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || inputs.expected_commit }}
        run: node scripts/smoke-demo.mjs
