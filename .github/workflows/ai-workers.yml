name: Live Gemini workers
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-gemini-workers

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node gemini-workers.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
